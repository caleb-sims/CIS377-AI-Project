<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Python Code Optimizer Gradio demo</title>
  <desc id="desc">A mockup of the Gradio interface showing a slow Python function, the CodeT5-optimized version, correctness results, speedup, and latency.</desc>

  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="optbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="origbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Page background -->
  <rect width="1200" height="820" fill="#eef2f7"/>

  <!-- Browser window -->
  <rect x="40" y="28" width="1120" height="764" rx="18" fill="#ffffff" stroke="#dbe3ee" filter="url(#shadow)"/>
  <path d="M40 72 h1120" stroke="#e5eaf2"/>
  <circle cx="70" cy="50" r="6" fill="#f87171"/>
  <circle cx="92" cy="50" r="6" fill="#fbbf24"/>
  <circle cx="114" cy="50" r="6" fill="#34d399"/>
  <rect x="145" y="39" width="420" height="22" rx="11" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="162" y="55" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#64748b">http://127.0.0.1:7860</text>

  <!-- Hero -->
  <text x="600" y="132" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="42" font-weight="800" fill="url(#hero)" letter-spacing="-1">Python Code Optimizer</text>
  <text x="600" y="164" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#64748b">A 60M-parameter CodeT5 model rewrites slow Python functions into faster, behavior-preserving versions.</text>

  <!-- Step 1 -->
  <circle cx="72" cy="208" r="14" fill="#6366f1"/>
  <text x="72" y="213" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="96" y="214" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Choose a function</text>

  <rect x="60" y="230" width="830" height="44" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="82" y="257" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#0f172a">Subarray Sum Count</text>
  <circle cx="866" cy="252" r="3" fill="#64748b"/>
  <text x="886" y="257" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">·  hashing</text>
  <rect x="920" y="230" width="200" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1020" y="257" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#334155">🎲  Random</text>

  <rect x="60" y="286" width="1060" height="34" rx="8" fill="#eef2ff"/>
  <text x="78" y="308" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#4338ca" font-weight="700">hashing</text>
  <text x="140" y="308" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Original complexity: O(n²) time, O(1) space</text>
  <text x="360" y="308" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">Return the number of contiguous subarrays of nums whose sum is exactly k.</text>

  <!-- Step 2 -->
  <circle cx="72" cy="350" r="14" fill="#6366f1"/>
  <text x="72" y="355" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="96" y="356" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Optimize</text>

  <rect x="60" y="372" width="1060" height="40" rx="10" fill="#6366f1"/>
  <text x="590" y="398" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">⚡  Optimize</text>

  <!-- Code panels -->
  <rect x="60" y="430" width="520" height="230" rx="12" fill="#f8fafc" stroke="#dbe3ee"/>
  <text x="78" y="454" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.5">ORIGINAL FUNCTION</text>
  <text x="78" y="478" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" fill="#0f172a"><tspan x="78" dy="0">def subarray_sum_count(nums, k):</tspan><tspan x="78" dy="16">    count = 0</tspan><tspan x="78" dy="16">    for i in range(len(nums)):</tspan><tspan x="78" dy="16">        s = 0</tspan><tspan x="78" dy="16">        for j in range(i, len(nums)):</tspan><tspan x="78" dy="16">            s += nums[j]</tspan><tspan x="78" dy="16">            if s == k:</tspan><tspan x="78" dy="16">                count += 1</tspan><tspan x="78" dy="16">    return count</tspan></text>

  <rect x="600" y="430" width="520" height="230" rx="12" fill="#f8fafc" stroke="#bae6fd"/>
  <text x="618" y="454" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#0284c7" letter-spacing="0.5">OPTIMIZED BY THE MODEL</text>
  <text x="618" y="478" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" fill="#0f172a"><tspan x="618" dy="0">def subarray_sum_count(nums, k):</tspan><tspan x="618" dy="16">    from collections import defaultdict</tspan><tspan x="618" dy="16">    counts = defaultdict(int)</tspan><tspan x="618" dy="16">    counts[0] = 1</tspan><tspan x="618" dy="16">    prefix = 0</tspan><tspan x="618" dy="16">    total = 0</tspan><tspan x="618" dy="16">    for x in nums:</tspan><tspan x="618" dy="16">        prefix += x</tspan><tspan x="618" dy="16">        total += counts[prefix - k]</tspan><tspan x="618" dy="16">        counts[prefix] += 1</tspan><tspan x="618" dy="16">    return total</tspan></text>

  <!-- Step 3 -->
  <circle cx="72" cy="692" r="14" fill="#6366f1"/>
  <text x="72" y="697" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <text x="96" y="698" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Results</text>

  <!-- Result cards -->
  <rect x="60" y="712" width="250" height="58" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="185" y="738" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#16a34a">Correct &amp; faster</text>
  <text x="185" y="756" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" fill="#4ade80" letter-spacing="1">VERDICT</text>

  <rect x="324" y="712" width="250" height="58" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="449" y="738" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#4f46e5">84.4×</text>
  <text x="449" y="756" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" fill="#818cf8" letter-spacing="1">SPEEDUP</text>

  <rect x="588" y="712" width="250" height="58" rx="12" fill="#f8fafc" stroke="#dbe3ee"/>
  <text x="713" y="738" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#0f172a">6/6</text>
  <text x="713" y="756" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" fill="#94a3b8" letter-spacing="1">TESTS PASSED</text>

  <rect x="852" y="712" width="268" height="58" rx="12" fill="#f8fafc" stroke="#dbe3ee"/>
  <text x="986" y="738" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#0f172a">848 ms</text>
  <text x="986" y="756" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" fill="#94a3b8" letter-spacing="1">MODEL LATENCY</text>

  <!-- Runtime comparison -->
  <text x="60" y="790" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#94a3b8">Outputs are executed against the bundled test cases; runtime is measured on a larger benchmark input in an isolated process.</text>
</svg>
